{% load static i18n %}

<div class="wa-card">
    <div class="wa-head">
        <div class="wa-avatar">
            {% if mandir.logo %}
                <img src="{{ mandir.logo.url }}" alt="{{ mandir.name }}">
            {% else %}
                <i class="fab fa-whatsapp"></i>
            {% endif %}
        </div>
        <div class="wa-head-name">
            {{ mandir.name }}
            <span class="wa-head-sub">WhatsApp</span>
        </div>
    </div>

    <div class="wa-chat">
        <div class="wa-msg">
            <div class="wa-msg-name">{{ mandir.name }}</div>
            <div class="wa-msg-greet">जय जिनेन्द्र</div>
            <div class="wa-msg-body">{{ mandir.whatsapp_message|default:""|safe }}</div>
        </div>
    </div>

    <div class="wa-foot">
        <button type="button" class="wa-start"
                onclick="Openwhatsapp('+91{{ mandir.whatsapp_number }}')">
            <i class="fab fa-whatsapp"></i> Start chat
        </button>
    </div>
</div>
