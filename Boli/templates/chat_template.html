{% load static i18n %}
<style>
    .wa-card { margin: -18px; }
    .wa-head {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px;
        background: var(--c-green-d);
        color: var(--c-white);
    }
    .wa-avatar {
        flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%;
        background: var(--c-white); overflow: hidden;
        display: grid; place-items: center;
        border: 2px solid rgba(255,255,255,.25);
    }
    .wa-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wa-avatar i { color: var(--c-green); font-size: 22px; }
    .wa-head-name {
        font-family: var(--font-head); font-size: 18px; font-weight: 600;
        line-height: 1.25; min-width: 0; overflow-wrap: anywhere;
    }
    .wa-head-sub { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 400; opacity: .75; }

    .wa-chat {
        background: #ECE5DD;
        padding: 18px 16px 22px;
        min-height: 200px; max-height: 50vh; overflow-y: auto;
    }
    .wa-msg {
        position: relative; max-width: 88%;
        background: var(--c-white);
        border-radius: 0 10px 10px 10px;
        padding: 9px 12px 10px;
        box-shadow: 0 1px 1px rgba(0,0,0,.12);
        font-size: 14px; line-height: 1.5; color: var(--c-text);
        overflow-wrap: anywhere;
    }
    .wa-msg::before {
        content: ''; position: absolute; top: 0; left: -8px;
        border-top: 10px solid var(--c-white);
        border-left: 8px solid transparent;
    }
    .wa-msg-name { font-size: 13px; font-weight: 600; color: var(--c-green); margin-bottom: 3px; }
    .wa-msg-greet { margin-bottom: 4px; }
    .wa-msg-body a { color: var(--c-blue); text-decoration: underline; word-break: break-all; }
    .wa-msg-body strong, .wa-msg-body b { font-weight: 600; }

    .wa-foot { padding: 14px 18px 18px; background: var(--c-white); border-top: 0.5px solid var(--c-border); }
    .wa-start {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; padding: 12px 16px;
        background: #25D366; color: var(--c-white);
        border: none; border-radius: 999px; cursor: pointer;
        font-family: var(--font-body); font-size: 15px; font-weight: 600;
        box-shadow: 0 2px 8px rgba(37,211,102,.35);
        transition: background .15s, transform .15s;
    }
    .wa-start:hover { background: #1EBE5A; transform: translateY(-1px); }
    .wa-start i { font-size: 22px; }
</style>

<div class="wa-card">
    <div class="wa-head">
        <div class="wa-avatar">
            {% if mandir.logo %}
                <img src="{{ mandir.logo.url }}" alt="{{ mandir.name }}">
            {% else %}
                <i class="fab fa-whatsapp"></i>
            {% endif %}
        </div>
        <div class="wa-head-name">
            {{ mandir.name }}
            <span class="wa-head-sub">WhatsApp</span>
        </div>
    </div>

    <div class="wa-chat">
        <div class="wa-msg">
            <div class="wa-msg-name">{{ mandir.name }}</div>
            <div class="wa-msg-greet">जय जिनेन्द्र</div>
            <div class="wa-msg-body">{{ mandir.whatsapp_message|default:""|safe }}</div>
        </div>
    </div>

    <div class="wa-foot">
        <button type="button" class="wa-start"
                onclick="Openwhatsapp('+91{{ mandir.whatsapp_number }}')">
            <i class="fab fa-whatsapp"></i> Start chat
        </button>
    </div>
</div>
