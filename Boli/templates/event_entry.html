{% extends "base.html" %}
{% load static i18n %}
{% block title %}{% trans "Event Registration" %}{% endblock %}
{% block extra_css %}
<style>
.event-reg-page { padding: 28px 0 60px; max-width: 580px; margin: 0 auto; }
.page-hd { margin-bottom: 20px; }
.page-hd h1 { font-family: var(--font-head); font-size: 24px; font-weight: 700; margin-bottom: 3px; }
.page-hd p { font-size: 13px; color: var(--c-text-3); }
.radio-group { display: flex; gap: 20px; margin-top: 4px; }
.radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--c-text-2); cursor: pointer; }
</style>
{% endblock %}
{% block main %}
<div class="container">
<div class="event-reg-page">
    <div class="page-hd">
        <h1>Event Registration</h1>
        <p>Registration open till 20th March — Jai Jinendra</p>
    </div>
    <div class="card">
        <div class="card-body">
            <form action="/action_page.php" style="border:none;">
                <div class="form-row">
                    <div class="form-field"><label>Full Name</label><input type="text" placeholder="Your full name" required></div>
                    <div class="form-field"><label>Mobile Number</label><input type="text" placeholder="Mobile number" required></div>
                </div>
                <div class="form-field">
                    <label>Nominate as</label>
                    <select required>
                        <option value="">-- Select --</option>
                        <option>Indra-Indrani</option><option>Indra</option><option>Indrani</option><option>Normal</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-field"><label>Members for food</label><input type="text" placeholder="Count" required></div>
                    <div class="form-field"><label>Members staying</label><input type="text" placeholder="Count" required></div>
                </div>
                <div class="form-field">
                    <label>Stay Facility</label>
                    <div class="radio-group">
                        <label><input type="radio" name="stay" value="Yes"> Yes</label>
                        <label><input type="radio" name="stay" value="No"> No</label>
                    </div>
                </div>
                <div class="form-field">
                    <label>Travel Facility</label>
                    <div class="radio-group">
                        <label><input type="radio" name="travel" value="Yes"> Yes</label>
                        <label><input type="radio" name="travel" value="No"> No</label>
                    </div>
                </div>
                <div class="form-field">
                    <label>Pick-up Location</label>
                    <select><option>Location 1</option><option>Location 2</option><option>Location 3</option><option>Location 4</option></select>
                </div>
                <div style="display:flex;gap:10px;margin-top:6px;">
                    <button type="button" class="btn btn-ghost" style="flex:1;" onclick="history.back()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:2;">Register</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
