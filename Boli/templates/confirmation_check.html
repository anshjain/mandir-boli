<!-- Confirmation Modal -->
<div class="modal-overlay" id="customConfirmation" style="display:none;">
  <div class="modal-box" style="max-width:420px;text-align:center;">
    <div class="modal-header">
      <span class="modal-title">⚠️ Confirm Payment</span>
      <button class="modal-close" onclick="closeConfirmationModel()">×</button>
    </div>
    <p style="font-size:15px;color:var(--ink-mid);margin-bottom:14px;">
      You are about to mark <strong>all pending amounts</strong> as paid.
    </p>
    <div style="font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--crimson);margin-bottom:6px;">
      ₹<span id="confirm_val">0</span>
    </div>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:24px;">Total amount</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="btn-submit" style="width:auto;padding:12px 28px;"
        onclick="openModelBox('01','{{ total_amt }}','{{ records.0.boli_date|date }}','None','{{ records.0.account.pan_card }}')"
        id="confirmYes">Yes, proceed</button>
      <button class="btn-cancel" style="width:auto;padding:12px 28px;margin-top:0;"
        onclick="closeConfirmationModel()" id="confirmNo">Cancel</button>
    </div>
  </div>
</div>
