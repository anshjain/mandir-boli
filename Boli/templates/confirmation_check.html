{% load static %}
<link rel="stylesheet" href="{% static 'css/payment_modals.css' %}">
<!-- Confirmation Modal -->
<div class="modal-overlay is-hidden" id="customConfirmation">
  <div class="modal-box modal-box--confirm">
    <div class="modal-header">
      <span class="modal-title">⚠️ Confirm Payment</span>
      <button class="modal-close" onclick="closeConfirmationModel()">×</button>
    </div>
    <p class="confirm-text">
      You are about to mark <strong>all pending amounts</strong> as paid.
    </p>
    <div class="confirm-amount">
      ₹<span id="confirm_val">0</span>
    </div>
    <p class="confirm-label">Total amount</p>
    <div class="confirm-actions">
      <button class="btn-submit btn-submit--auto"
        onclick="openModelBox('01','{{ total_amt }}','{{ records.0.boli_date|date }}','None','{{ records.0.account.pan_card }}')"
        id="confirmYes">Yes, proceed</button>
      <button class="btn-cancel btn-cancel--auto"
        onclick="closeConfirmationModel()" id="confirmNo">Cancel</button>
    </div>
  </div>
</div>
