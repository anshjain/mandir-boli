<!-- Payment Modal -->
<div class="modal-overlay" id="EmailModal" style="display:none;">
  <div class="modal-box" style="max-width:500px;">
    <div class="modal-header">
      <span class="modal-title">💳 Payment Details</span>
      <button class="modal-close" onclick="close_update()">×</button>
    </div>
    <form action="{% url 'payment-done' %}" method="post" name="paymentComplete">
      {% csrf_token %}
      <div class="modal-amount-display">₹<span id="amount_val">0</span></div>
      <div class="modal-amount-sub">
        <span id="Paid_amount" style="display:none;">Amount paid: <span id="paid_amount_sub">0</span></span>
        <span id="Original_amount">Original: ₹<span id="org_amount_val">0</span></span>
        &nbsp;·&nbsp; Boli Date: <span id="boli_date">—</span>
      </div>
      <input type="hidden" id="record_id" name="record_id">
      <input type="hidden" id="phone_number" name="phone_number">

      <div class="modal-field">
        <label>Partial Amount (if partial payment)</label>
        {{ payment_form.partial_payment }}
      </div>
      <div class="modal-field">
        <label>Payment Mode</label>
        {{ payment_form.payment_mode }}
      </div>
      <div class="modal-field">
        <label>Transaction / ID Details</label>
        {{ payment_form.id_details }}
      </div>
      <div class="modal-field">
        <label>Send Email To</label>
        {{ payment_form.send_to }}
      </div>
      <div class="modal-field">
        <label>PAN Card</label>
        {{ payment_form.pan_card }}
      </div>
      <div class="modal-field">
        <label>Remark</label>
        {{ payment_form.remark }}
      </div>
      <button class="btn-submit" type="submit">Send Email &amp; Confirm ✓</button>
      <button type="button" class="btn-cancel" onclick="close_update()">Cancel</button>
    </form>
  </div>
</div>
